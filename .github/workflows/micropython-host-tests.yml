name: MicroPython Host Tests

on:
  pull_request:
    paths:
      - "src/weather_station_mpy/**"
      - "requirements.txt"
      - "run_tests.cmd"
      - ".github/workflows/micropython-*.yml"
  push:
    branches:
      - main
      - dev_micropython
    paths:
      - "src/weather_station_mpy/**"
      - "requirements.txt"
      - "run_tests.cmd"
      - ".github/workflows/micropython-*.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run MicroPython host test suite
        run: |
          python -m pytest src/weather_station_mpy/tests \
            --ignore=src/weather_station_mpy/tests/device \
            --ignore=src/weather_station_mpy/tests/hil \
            -v
